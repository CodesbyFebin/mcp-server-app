version: "3.9"

services:
  web:
    image: node:20-alpine
    working_dir: /app
    command: ["npm", "run", "start"]
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
    environment:
      - NODE_ENV=production

  app:
    image: node:20-alpine
    working_dir: /app
    command: ["npm", "run", "start"]
    ports:
      - "3001:3001"
    volumes:
      - ./apps/app:/app
    environment:
      - NODE_ENV=production

  api:
    image: node:20-alpine
    working_dir: /app
    command: ["npm", "run", "start"]
    ports:
      - "8001:8001"
    volumes:
      - ./services/api:/app
    environment:
      - NODE_ENV=production

  mcp-server:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "main.py"]
    ports:
      - "8000:8000"
    volumes:
      - ./services/mcp-server:/app
    environment:
      - PYTHONUNBUFFERED=1

  gateway:
    image: node:20-alpine
    working_dir: /app
    command: ["npm", "run", "start"]
    ports:
      - "8002:8002"
    volumes:
      - ./services/gateway:/app
    environment:
      - NODE_ENV=production

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=mcp_servers
      - POSTGRES_USER=mcp_user
      - POSTGRES_PASSWORD=mcp_pass
    ports:
      - "5432:5432"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/root/.caddy
    depends_on:
      - web
      - app
      - api
      - mcp-server
      - gateway

volumes:
  caddy_data: